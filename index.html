<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007C78">
<meta name="description" content="Acompanhe sua proteína diária: registre refeições, veja quanto falta para a meta e receba opções práticas.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protein">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Studio Fit Protein</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>@font-face{font-family:"Sora";src:url("fonts/sora.woff2") format("woff2");font-weight:100 800;font-display:swap}@font-face{font-family:"Manrope";src:url("fonts/manrope.woff2") format("woff2");font-weight:200 800;font-display:swap}</style>
<style>
/* Layout: app de uma coluna para celular — topo fixo, conteúdo rolável, barra inferior com botão central de registro */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#EAF0EE; --line:#DCE4E1;
  --ink:#13211F; --muted:#5B6B68; --teal:#007C78; --teal-soft:#D5ECEA;
  --magenta:#C0265C; --magenta-soft:#F7DCE6; --warn:#9A6A00; --warn-soft:#FBF0D6;
  --shadow:0 1px 2px rgba(19,33,31,.06),0 8px 24px rgba(19,33,31,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1514; --surface:#16211F; --surface-2:#1D2B29; --line:#2A3A37;
  --ink:#E7EFED; --muted:#9AAEAA; --teal:#33B5AE; --teal-soft:#123C3A;
  --magenta:#E8628B; --magenta-soft:#41182A; --warn:#E8B64A; --warn-soft:#3A2E12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#16211F; --surface-2:#1D2B29; --line:#2A3A37;
  --ink:#E7EFED; --muted:#9AAEAA; --teal:#33B5AE; --teal-soft:#123C3A;
  --magenta:#E8628B; --magenta-soft:#41182A; --warn:#E8B64A; --warn-soft:#3A2E12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.wordmark span{color:var(--teal)}
.proto{align-self:flex-start;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:99px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}

.view{display:flex;flex-direction:column;gap:16px}
h2.v-title{font-family:var(--f-display);font-size:22px;font-weight:700;margin:4px 0 0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin:0}

/* Anel */
.ring-card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ring-wrap{position:relative;width:min(232px,62vw);aspect-ratio:1;max-width:100%}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{stroke:var(--surface-2)}
.ring-prog{stroke:url(#ringGrad);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-val{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,12vw,52px);line-height:1;letter-spacing:-.03em}
.ring-val small{font-size:.42em;font-weight:600;color:var(--muted);margin-left:2px}
.ring-of{color:var(--muted);font-size:15px;margin-top:6px}
.ring-done{margin-top:8px;font-size:14px;font-weight:700;color:var(--teal);background:var(--teal-soft);padding:4px 10px;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border-top:1px solid var(--line);padding-top:14px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-size:20px;font-weight:600}
.stat span{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat.left b{color:var(--magenta)}
.meta-note{font-size:14px;color:var(--muted);text-align:center}

.cta-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--teal);color:#fff;text-align:left;width:100%}
.cta-card .big{font-family:var(--f-display);font-size:18px;font-weight:700}
.cta-card .small{font-size:15px;opacity:.88}
.cta-card .arrow{margin-left:auto;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.done-card{padding:16px;border-radius:var(--r);background:var(--teal-soft);color:var(--ink);display:flex;gap:12px;align-items:center}
.done-card b{font-family:var(--f-display)}

.meal-block{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 8px}
.meal-head h3{margin:0;font-size:17px;font-weight:700}
.meal-head .tot{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--teal)}
.meal-empty{padding:0 16px 14px;color:var(--muted);font-size:15px}
.entry{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.entry-del-bg{position:absolute;inset:0 0 0 auto;width:96px;background:var(--magenta);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.entry-main{position:relative;background:var(--surface);display:flex;align-items:center;gap:10px;padding:11px 8px 11px 16px;transition:transform .2s ease;touch-action:pan-y}
.entry-info{flex:1;min-width:0}
.entry-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.entry-p{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap}
.mini-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.mini-btn:hover{background:var(--surface-2)}
.mini-btn svg{width:18px;height:18px}
.badge{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:6px;white-space:nowrap}
.b-sim{background:var(--warn-soft);color:var(--warn)}
.b-ilu{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--teal-soft);color:var(--teal)}
.b-whey{background:var(--magenta-soft);color:var(--magenta)}
.b-neutral{background:var(--surface-2);color:var(--muted)}
.b-user{background:var(--surface-2);color:var(--ink)}
.foot-note{font-size:14px;color:var(--muted);line-height:1.5;padding:4px 2px}

/* Navegação inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;align-items:end;height:68px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;font-size:13px;font-weight:600;color:var(--muted)}
.nav-btn svg{width:22px;height:22px}
.nav-btn[aria-current="page"]{color:var(--teal)}
.fab-slot{display:flex;justify-content:center}
.fab{width:60px;height:60px;border-radius:50%;background:var(--magenta);color:#fff;display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 8px 20px rgba(192,38,92,.35)}
.fab svg{width:28px;height:28px}

/* Folhas (bottom sheets) */
.backdrop{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:none}
.sheet-in{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px 6px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));flex:none}
.sheet-head h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700}
.sheet-body{overflow-y:auto;padding:6px 20px 20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-height:0}
.sheet-foot{padding:12px 20px 16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);flex:none;background:var(--bg)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:17px}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:var(--surface);box-shadow:var(--shadow)}
.btn-sm{width:auto;padding:9px 14px;font-size:15px;border-radius:11px}
.choice{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%}
.choice .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.choice .ic svg{width:24px;height:24px}
.choice b{display:block;font-size:18px}
.choice span{font-size:15px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 6px;border-radius:9px;font-size:15px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.stepper button{width:48px;height:48px;border-radius:12px;background:var(--surface-2);font-size:24px;font-weight:600}
.stepper .val{font-family:var(--f-display);font-size:24px;font-weight:600}
.stepper .val small{font-size:16px;color:var(--muted);font-weight:500;margin-left:2px}
.p-result{text-align:center;padding:6px 0}
.p-result b{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--teal)}
.p-result span{display:block;font-size:14px;color:var(--muted)}
details.more{background:var(--surface);border-radius:14px;padding:12px 14px}
details.more summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:10px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.label{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}

.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:15px;font-weight:600;line-height:1.4}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.notice.sticky{position:sticky;top:0;z-index:2}

/* Busca manual */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:0 14px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;padding:14px 0;font:inherit;color:var(--ink);outline:none}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;text-align:left;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row .ri{flex:1;min-width:0}
.row .rn{font-weight:600;font-size:16px}
.row .rm{font-size:14px;color:var(--muted)}
.row .rp{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--teal);white-space:nowrap}

/* Foto */
.photo-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pick label{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 10px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:16px;cursor:pointer;text-align:center}
.photo-pick label svg{width:28px;height:28px;color:var(--teal)}
.photo-pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-prev{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);background:var(--surface-2)}
.sim-item{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.sim-item.off{opacity:.45}
.sim-top{display:flex;align-items:flex-start;gap:10px}
.sim-top .ri{flex:1;min-width:0}
.conf{font-size:13px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.conf.alta{background:var(--teal-soft);color:var(--teal)}
.conf.media{background:var(--surface-2);color:var(--muted)}
.conf.incerta{background:var(--warn-soft);color:var(--warn)}
.mini-step{display:flex;align-items:center;gap:10px}
.mini-step button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);font-size:18px;font-weight:700}
.mini-step span{font-weight:700;min-width:64px;text-align:center}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:16px;font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--teal);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sugestões */
.meal-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.meal-tabs button{padding:10px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:700;color:var(--muted)}
.meal-tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters{display:flex;flex-direction:column;gap:8px}
.combo{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.combo-top{display:flex;gap:12px;align-items:flex-start}
.combo-top .ri{flex:1;min-width:0}
.combo h4{margin:0;font-size:17.5px;font-weight:700;line-height:1.3}
.combo .ing{font-size:15px;color:var(--muted);margin-top:3px}
.combo .pbig{text-align:right;flex:none}
.combo .pbig b{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--teal);display:block;line-height:1}
.combo .pbig span{font-size:13px;color:var(--muted)}
.combo-tags{display:flex;flex-wrap:wrap;gap:6px}
.combo-actions{display:flex;gap:8px;align-items:center}
.combo-actions .btn{flex:1}
.ing-table{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:8px}
.ing-table td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.ing-table td:last-child{text-align:right;white-space:nowrap;padding-left:8px}
.ing-table .src{display:block;color:var(--muted);font-size:13px}
.hint{font-size:15px;color:var(--muted)}
.hint b{color:var(--magenta)}

/* Comparador */
.cmp-row{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.cmp-row select{width:100%;font:inherit;font-weight:600;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.cmp-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmp-out div{background:var(--surface-2);border-radius:12px;padding:10px 8px;text-align:center}
.cmp-out b{display:block;font-family:var(--f-display);font-size:18px;font-weight:600}
.cmp-out span{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.cmp-row.best{outline:2px solid var(--teal)}
.cmp-flag{font-size:14px;font-weight:700;color:var(--warn)}

/* Histórico */
.hist-card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:18px 14px 12px}
.hist-svg{width:100%;height:auto;display:block}
.hist-sum{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.hist-sum b{font-family:var(--f-display);font-size:22px}
.day-list .row[aria-pressed="true"]{background:var(--teal-soft)}

/* Comemoração */
.celebrate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(10,20,18,.55);opacity:0;transition:opacity .3s}
.celebrate.show{opacity:1}
.cel-card{position:relative;background:var(--surface);border-radius:28px;padding:30px 24px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:scale(.92);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.celebrate.show .cel-card{transform:none}
.cel-ring{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal),var(--magenta),var(--teal))}
.cel-ring div{width:78px;height:78px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--teal)}
.cel-card h3{font-family:var(--f-display);font-size:20px;line-height:1.3;margin:0 0 8px;text-wrap:balance}
.cel-card p{color:var(--muted);font-size:16px;margin:0 0 18px}
#confetti{position:fixed;inset:0;z-index:61;pointer-events:none;width:100%;height:100%}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:50;background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

body.onb-mode nav.bottom{display:none}

.onb-body{display:flex;flex-direction:column;gap:16px}

.inp-u{display:flex;align-items:center;gap:10px}

.err{color:var(--magenta);font-size:15px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}

.prof-form{display:flex;flex-direction:column;gap:12px}
.greet{display:flex;flex-direction:column;gap:2px}

.sug-inline{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-head h3{margin:0;font-family:var(--f-display);font-size:18px}
.link{color:var(--teal);font-weight:700;font-size:15px}
.opt-row{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.opt-row .ri{flex:1;min-width:0}
.opt-row .rn{font-weight:700;font-size:16px}
.opt-row .rm{font-size:14px;color:var(--muted)}
.or-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}

.prof-card{display:flex;align-items:center;gap:14px}
.avatar-lg{width:52px;height:52px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;flex:none}
.prof-card .rn{font-weight:700;font-size:18px}
.prof-card .rm{font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.cmp-meta div{display:flex;flex-direction:column;align-items:center;gap:4px}
.cmp-meta b{font-family:var(--f-display);font-size:28px}
.guide{background:var(--teal-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.guide h3{margin:0;font-family:var(--f-display);font-size:18px}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.sh-row{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.sh-n{font-weight:700;font-size:16px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.privacy{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}

.ways{display:flex;flex-direction:column;gap:8px;margin-top:6px}

.btn{min-height:52px}

/* ===== META INDIVIDUAL: regra documentada em METODO-META.md =====
   meta = peso usado (kg) × fator (g/kg/dia), arredondada para múltiplo de 5 g.
   Cada objetivo tem uma faixa publicada; o nível de atividade escolhe o ponto
   dentro da faixa (pontos intermediários são decisão de projeto, para revisão
   profissional). Resultado = ESTIMATIVA EDUCATIVA, não prescrição. */
const OBJ = {

const SEXO = [["f","Feminino"],["m","Masculino"],["n","Prefiro não informar"]];
const imcOf = pf => pf.peso/((pf.altura/100)**2);
function estimate(pf){
  const r={blocked:null,avisos:[]}; const imc=imcOf(pf); r.imc=imc;
  if(pf.idade<18) r.blocked="Para menores de 18 anos, a meta de proteína deve ser definida por um profissional.";
  else if(pf.saude==="sim") r.blocked="Você indicou uma situação de saúde que pode exigir controle da proteína. A meta deve ser definida pelo médico ou nutricionista que acompanha você.";
  else if(imc<18.5) r.blocked="Seu IMC calculado está abaixo de 18,5. Nesse caso, a meta deve ser definida por um profissional.";
  if(r.blocked) return r;
  const o=OBJ[pf.objetivo], i=NIV.findIndex(n=>n.id===pf.nivel);
  let f=o.pts[i];
  if(pf.idade>=65 && f<1.0){ f=1.0; r.avisos.push("A partir de 65 anos, o fator mínimo usado é 1,0 g/kg/dia (PROT-AGE)."); }
  if(pf.objetivo==="env" && pf.idade<65) r.avisos.push("A referência PROT-AGE foi definida para pessoas acima de 65 anos; abaixo dessa idade, a estimativa é uma aproximação.");
  if((pf.objetivo==="massa"||pf.objetivo==="recomp") && pf.nivel==="sed") r.avisos.push("Ganho de massa muscular depende de treino de força regular.");
  let pesoCalc=pf.peso, pesoTipo="peso atual";
  if(imc>=30){ pesoCalc=25*(pf.altura/100)**2; pesoTipo="peso de referência (IMC 25)";
    r.avisos.push("Com IMC a partir de 30, o cálculo usa o peso equivalente ao IMC 25 para não superestimar a meta. Recomendamos validar com um profissional."); }
  return Object.assign(r,{fator:f,pesoCalc,pesoTipo,valor:Math.round(pesoCalc*f/5)*5,faixa:[Math.round(pesoCalc*o.faixa[0]),Math.round(pesoCalc*o.faixa[1])],faixaGkg:o.faixa,ref:o.ref,objetivo:pf.objetivo,nivel:pf.nivel,peso:pf.peso,altura:pf.altura,idade:pf.idade});
}

const KEYS={perfil:"sfp-perfil-v2",demo:"sfp-demo-v2"}, KMODE="sfp-modo";

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function load(m){ const raw=lsGet(KEYS[m]); if(!raw) return null; try{ const d=JSON.parse(raw); return d&&d.v===2&&d.profile?d:null; }catch(e){ return null; } }
function save(){ if(S&&MODE) lsSet(KEYS[MODE], JSON.stringify(S)); }

const pad = n=>String(n).padStart(2,"0");
const dkey = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = ()=>dkey(new Date());
const daysAgo = n=>{const d=new Date(); d.setDate(d.getDate()-n); return dkey(d);};

const fmt = (n,d=1)=>Number(n).toLocaleString("pt-BR",{maximumFractionDigits:d});
const fmtP = n=> n>=10 ? fmt(Math.round(n),0) : fmt(n,1);
const norm = s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Refeição sugerida: a última que a pessoa escolheu (por 30 min); senão, pelo horário */
let STK=null;
function pickMeal(m){ if(MEAL_NAME[m]) STK={m,t:Date.now()}; }
function defMeal(){ return STK&&Date.now()-STK.t<30*60000?STK.m:currentMeal(); }
function mealPickHTML(cur){ return `<div class="field meal-pick"><span class="label">Para qual refeição?</span><div class="chips">${MEALS.map(([m,l])=>`<button class="chip" data-meal="${m}" aria-pressed="${cur===m}">${l}</button>`).join("")}</div></div>`; }
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("#sheetBody [data-meal]"); if(b) pickMeal(b.dataset.meal); },true);
function currentMeal(){ const h=new Date().getHours()+new Date().getMinutes()/60; if(h<10.5) return "cafe"; if(h<15) return "almoco"; if(h<18.5) return "lanche"; return "jantar"; }

/* meta válida em cada dia (o histórico usa a meta da época) */
function dayMeta(k){ const L=S.metaLog||[]; let v=L.length?L[0].valor:0; for(const m of L){ if(m.desde<=k) v=m.valor; } return v; }
function metaHoje(){ return dayMeta(today()); }
function setMeta(valor,tipo,extra={},desde){
  const k=desde||today(); S.meta={valor,tipo,...extra,definidaEm:k};
  S.metaLog=(S.metaLog||[]).filter(m=>m.desde!==k); S.metaLog.push({desde:k,valor,tipo}); S.metaLog.sort((a,b)=>a.desde<b.desde?-1:1); save();
}

function per100(f){
  if(f.whey){ const w=S.whey; return {p:w.p/w.porcao*100, kcal:w.kcal/w.porcao*100, fat:w.fat/w.porcao*100}; }
  return {p:f.p,kcal:f.kcal,fat:f.fat};
}
function foodNut(id,g){ const v=per100(FOOD[id]); return {p:v.p*g/100,kcal:v.kcal*g/100,fat:v.fat*g/100}; }
function comboNut(c,m=1){ let t={p:0,kcal:0,fat:0}; c.ing.forEach(([id,g])=>{const v=foodNut(id,g*m); t.p+=v.p;t.kcal+=v.kcal;t.fat+=v.fat;}); return t; }
const isIlu = id=>FOOD[id].src!=="TACO" || (FOOD[id].whey && S.whey.ilustrativo);
const comboIlu = c=>c.ing.some(([id])=>isIlu(id));
const comboWhey = c=>c.ing.some(([id])=>FOOD[id].whey);
const comboPronto = c=>c.ing.every(([id])=>FOOD[id].pronto);
const unit = f=>f.unit||"g";

function shakeNut(ing){ let t={p:0,kcal:0,fat:0}; ing.forEach(([id,g])=>{ const v=foodNut(id,g); t.p+=v.p; t.kcal+=v.kcal; t.fat+=v.fat; }); return t; }
function makeEntry(o){
  const base={id:uid(),meal:o.meal,ts:Date.now(),sim:!!o.sim};
  if(o.kind==="shake"){ const v=shakeNut(o.ing); return {...base,kind:"shake",n:o.n||"Shake com whey",ing:o.ing,...v,ilu:o.ing.some(([id])=>isIlu(id))}; }
  if(o.kind==="combo"){ const c=COMBO[o.ref]; const v=comboNut(c,o.mult); return {...base,kind:"combo",ref:o.ref,mult:o.mult,n:c.n,...v,ilu:comboIlu(c)}; }
  if(o.kind==="custom") return {...base,kind:"custom",n:o.n,p:o.p,kcal:o.kcal??null,fat:null,ilu:false,user:true};
  const f=FOOD[o.ref]; const v=foodNut(o.ref,o.g); return {...base,kind:"food",ref:o.ref,g:o.g,n:f.n,...v,ilu:isIlu(o.ref)};
}

function seedDemo(){

  const plan=[["c1","a1","l3","j2"],["c2","a2","l5","j1"],["c6","a5","l4","j4"],["c1","a6","l1","j6"],["c3","a3","l6","j3"],["c5","a4","l2","j5"]];
  plan.forEach((ids,i)=>{ const k=daysAgo(6-i); S.days[k]=ids.map(id=>({...makeEntry({kind:"combo",ref:id,mult:1,meal:COMBO[id].meal}),demo:true}));

function countUp(a,b){ const el=document.getElementById("ringVal"); const t0=performance.now(), D=900;

function setupSwipe(row){
  const main=row.querySelector(".entry-main"); let x0=null,y0=0,dx=0,dragging=false;
  main.addEventListener("touchstart",ev=>{ x0=ev.touches[0].clientX; y0=ev.touches[0].clientY; dx=0; dragging=false; main.style.transition="none"; },{passive:true});
  main.addEventListener("touchmove",ev=>{ if(x0===null) return; const mx=ev.touches[0].clientX-x0, my=ev.touches[0].clientY-y0;
    if(!dragging && Math.abs(mx)>10 && Math.abs(mx)>Math.abs(my)) dragging=true; if(!dragging) return; dx=Math.min(0,Math.max(-140,mx)); main.style.transform=`translateX(${dx}px)`; },{passive:true});
  main.addEventListener("touchend",()=>{ main.style.transition=""; if(dragging && dx<-80){ main.style.transform="translateX(-100%)"; setTimeout(()=>delEntry(row.dataset.id),180);} else main.style.transform=""; x0=null; });
}
let lastDeleted=null;
function delEntry(id){
  const k=today(), arr=S.days[k]||[], i=arr.findIndex(e=>e.id===id); if(i<0) return;
  lastDeleted={k,i,e:arr[i]}; arr.splice(i,1); save(); renderHoje();

}
function editEntry(id){ const e=dayEntries(today()).find(x=>x.id===id); if(!e) return;

  if(e.kind==="custom"){ openCustom({entryId:e.id,n:e.n,p:e.p,kcal:e.kcal,meal:e.meal}); return; }

const itemP=it=>it.raw?it.raw.p:(it.ref?foodNut(it.ref,it.g).p:0);
const itemN=it=>it.raw?it.raw.n:(it.ref?FOOD[it.ref].n:cap(it.label)+" (escolher)");
let FTOK=null;
function ftok(f){ if(!FTOK){ FTOK={}; FOODS.forEach(x=>{ FTOK[x.id]={name:toks(x.n),als:(ALIAS[x.id]||"").split(",").map(toks).filter(a=>a.length),hay:toks(foodHay(x))}; }); } return FTOK[f.id]; }
function foodScore(qt,f){
  if(!qt.length) return 0; const T=ftok(f);
  const has=hs=>qt.every(t=>hs.some(h=>h===t||(t.length>=4&&h.startsWith(t))));
  const eq=hs=>hs.length===qt.length && qt.every(t=>hs.includes(t));
  if(eq(T.name)||T.als.some(eq)) return 4;
  if(has(T.name)) return 3;
  if(T.als.some(has)) return 2;
  return has(T.hay)?1:0;
}
function bestFood(qt,min){ let best=null,bs=0; FOODS.forEach(f=>{ const s=foodScore(qt,f); if(s>bs){bs=s;best=f;} }); return bs>=min?best:null; }
function unitG(f){ const m=String(f.por[0][0]).match(/^(\d+|½)/); const n=m?(m[1]==="½"?0.5:+m[1]):1; return f.por[0][1]/n; }
function parseMeal(text){
  const items=[], unknown=[], seen=new Set(); let qty=false;
  const putAmb=(key,g,q)=>{ const sk="amb:"+GEN[key].label; if(seen.has(sk)) return; seen.add(sk);
    const it={amb:GEN[key].label,opts:GEN[key].ids.filter(id=>FOOD[id]),label:GEN[key].label,ref:null,g:null,gx:g,q};
    const pk=S&&S.pick&&S.pick[it.amb]; if(pk&&it.opts.includes(pk)) setRef(it,pk); items.push(it); };
  const put=(f,g,q)=>{ if(seen.has(f.id)) return; seen.add(f.id);
    const gg=g!=null?g:(q!=null?Math.round(q*unitG(f)):f.por[0][1]); items.push({ref:f.id,g:Math.max(1,Math.min(1500,gg))}); };
  String(text).replace(/½/g," 0.5 ").replace(/(\d)\s*\/\s*2\b/g,"0.5").split(/[,;+\n]+/).forEach(chunk=>{
    let s=norm(chunk).replace(/\.(?!\d)/g," ").replace(/queijo(s)? prato/g,"queijo pratoq").replace(/colher(es)?( de)?( sopa| cha| sobremesa| servir)?/g," ");
    let g=null,q=null; const words=[];
    s=s.replace(/(\d+(?:[.,]\d+)?)\s*(gramas|grama|gr|g|ml)\b/g,(m,n)=>" #g"+n.replace(",",".")+" ");
    s.split(/[^a-z0-9#.]+/).filter(Boolean).forEach(w=>{
      if(w.startsWith("#g")){ words.push({g:parseFloat(w.slice(2))}); return; }
      if(/^\d+(\.\d+)?$/.test(w)){ words.push({q:parseFloat(w)}); return; }
      if(w in QW){ words.push({q:QW[w]}); return; }
      if(UW.has(w)||STOP.has(w)||w.length<2) return;
      words.push({w});
    });
    let i=0, miss=[];
    const flush=()=>{ if(miss.length){ unknown.push(miss.join(" ")); miss=[]; } };
    while(i<words.length){
      const x=words[i];
      if(x.g!=null){ g=x.g; qty=true; i++; continue; }
      if(x.q!=null){ q=x.q; qty=true; i++; continue; }
      let found=null, used=0;
      for(let len=4; len>=1 && !found; len--){
        const span=[]; let j=i; while(j<words.length && span.length<len && words[j].w){ span.push(words[j].w); j++; }
        if(span.length<len) continue;
        const key=span.map(stem).join(" ");
        if(GEN[key]){ found={amb:key}; used=len; } else if(GAP.has(key)){ found={gap:span.join(" ")}; used=len; } else if(len===1&&PREP.has(key)){ found={skip:true}; used=1; } else { const f=bestFood(span.map(stem),2); if(f){ found=f; used=len; } }
      }
      if(found&&found.skip){ i++; continue; }
      if(found&&found.gap){ flush(); unknown.push(found.gap); g=null; q=null; i+=used; continue; }
      if(found){ flush();
        let k=i+used; if(g==null && k<words.length && words[k].g!=null){ g=words[k].g; k++; }
        if(k>i+used) qty=true;
        if(found.amb) putAmb(found.amb,g,q); else put(found,g,q); g=null; q=null; i=k; }
      else { miss.push(x.w); i++; }
    }
    flush();
  });
  return {items,unknown,qty};
}

function importBackup(file){ if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!(d&&d.v===2&&d.profile&&d.meta&&d.days&&typeof d.days==="object")) throw 0;
      d.demo=false; S=d; MODE="perfil"; fixState(); lsSet(KMODE,"perfil"); save(); closeSheet(); shownP=null; go("hoje"); toast("Cópia restaurada"); }
    catch(e){ toast("Arquivo inválido. Escolha a cópia salva por este aplicativo."); } };
  r.readAsText(file); }

      <div class="notice"><svg><use href="#i-warn"/></svg><span>Comida caseira e não sabe a proteína? Volte e busque um alimento parecido (ex.: <b>carne moída</b> → Acém moído). O app calcula pela porção.</span></div>

    ["rPor","rP","rQ"].forEach(id=>{ document.getElementById(id).oninput=()=>{ const a=numVal(document.getElementById("rPor").value), b=numVal(document.getElementById("rP").value), c=numVal(document.getElementById("rQ").value);

    document.querySelectorAll("#sheetBody [data-meal]").forEach(b=>b.onclick=()=>{ keep(); st.meal=b.dataset.meal; draw(); });
    document.getElementById("cOk").onclick=()=>{ keep();
      const n=String(o.n||"").trim(), p=numVal(o.p), k=String(o.kcal??"").trim()===""?null:numVal(o.kcal);

    ${fld("wPor","Porção do rótulo",w.porcao,"g")}${fld("wP","Proteínas na porção",w.p,"g")}${fld("wK","Valor energético na porção",w.kcal,"kcal")}${fld("wF","Gorduras totais na porção",w.fat,"g")}${fld("wC","Carboidratos na porção",w.carb,"g")}
    <button class="btn btn-ghost btn-sm" id="wReset">Voltar ao exemplo</button>`,
    `<button class="btn btn-primary" id="wSave">Salvar rótulo</button>`);

const SH_VOL=[100,150,200,250,300];
const SH_EXTRAS=["banana","morango","mamao","aveia","pasta_amend","amendoim","iogurte"];
const SH_DOSES=[[0.5,"½ porção"],[1,"1 porção"],[1.5,"1½ porção"],[2,"2 porções"]];
function shakeAutoName(ing,water){ const nomes=ing.filter(([id])=>id!=="whey").map(([id])=>FOOD[id].n.toLowerCase()); if(water) nomes.push("água"); return "Shake de whey"+(nomes.length?" com "+nomes.join(", "):""); }
function openShake(o){
  const por=()=>S.whey.porcao;
  const st={wg:por(),liq:"leite",vol:200,items:{},meal:o.meal||defMeal(),name:""};
  if(o.ing){
    st.liq="agua";
    o.ing.forEach(([id,g])=>{
      if(id==="whey") st.wg=g;
      else if(["leite","leite_int","soja"].includes(id)){ st.liq=id; st.vol=g; }
      else if(SH_EXTRAS.includes(id)) st.items[id]=g;
    });
  }
  const draw=()=>{
    const nm=document.getElementById("shName"); if(nm) st.name=nm.value;
    const ing=[["whey",st.wg]]; if(st.liq!=="agua") ing.push([st.liq,st.vol]);
    Object.entries(st.items).forEach(([id,g])=>ing.push([id,g]));
    const v=shakeNut(ing), ilu=ing.some(([id])=>isIlu(id)), auto=shakeAutoName(ing,st.liq==="agua");
    const body=`
      ${S.whey.ilustrativo?`<div class="notice"><svg><use href="#i-warn"/></svg><span>Você está usando um whey de exemplo (${fmt(S.whey.p)} g de proteína em ${fmt(S.whey.porcao)} g). Informe o rótulo do seu produto para a conta ficar certa.</span></div>`:""}
      <div class="field"><span class="label">1. Whey</span><div class="chips">${SH_DOSES.map(([d,l])=>`<button class="chip" data-wd="${d}" aria-pressed="${Math.abs(st.wg-por()*d)<0.05}">${l}</button>`).join("")}</div>
        <p class="hint">1 porção do rótulo = ${fmt(por())} g (${fmt(S.whey.p)} g de proteína). Aqui: ${fmt(st.wg)} g de whey.</p>
        <button class="btn btn-ghost btn-sm" id="shLabel">Usar o rótulo do meu whey</button></div>
      <div class="field"><span class="label">2. Líquido</span><div class="chips">${SH_LIQ.map(([id,l])=>`<button class="chip" data-liq="${id}" aria-pressed="${st.liq===id}">${l}</button>`).join("")}</div>
        ${st.liq!=="agua"?`<div class="chips">${SH_VOL.map(m=>`<button class="chip" data-vol="${m}" aria-pressed="${st.vol===m}">${m} ml</button>`).join("")}</div>`:`<p class="hint">Água não soma proteína.</p>`}</div>
      <div class="field"><span class="label">3. Frutas e extras (opcional)</span><div class="chips">${SH_EXTRAS.map(id=>`<button class="chip" data-ex="${id}" aria-pressed="${id in st.items}">${esc(FOOD[id].n)}</button>`).join("")}</div>
        ${Object.entries(st.items).map(([id,g])=>{ const f=FOOD[id]; return `<div class="sh-row"><div class="sh-n">${esc(f.n)}</div><div class="chips">${f.por.map(([l,pg])=>`<button class="chip" data-eg="${id}|${pg}" aria-pressed="${g===pg}">${l}</button>`).join("")}</div>
          <div class="mini-step"><button data-xm="${id}" aria-label="Diminuir">−</button><span class="num">${fmt(g,0)} g</span><button data-xp="${id}" aria-label="Aumentar">+</button></div></div>`; }).join("")}</div>
      <div class="p-result"><b class="num">≈ ${fmtP(v.p)} g</b><span>de proteína neste shake (estimativa)</span></div>
      <details class="more"><summary>Calorias, gordura e fonte</summary><dl class="kv"><dt>Calorias</dt><dd class="num">≈ ${fmt(Math.round(v.kcal),0)} kcal</dd><dt>Gorduras</dt><dd class="num">≈ ${fmt(v.fat)} g</dd><dt>Fonte</dt><dd>${ilu?"TACO + valores de rótulo (whey e leite: confira o rótulo)":"TACO 4ª ed. e rótulo informado por você"}</dd></dl></details>
      <label class="field" for="shName"><span class="label">Nome do shake (opcional)</span><input class="inp" id="shName" placeholder="${esc(auto)}" value="${esc(st.name)}"></label>
      <div class="field"><span class="label">Refeição</span><div class="chips">${MEALS.map(([m,,s])=>`<button class="chip" data-meal="${m}" aria-pressed="${st.meal===m}">${s}</button>`).join("")}</div></div>`;
    const foot=`<button class="btn btn-primary" id="shOk">${o.entryId?"Salvar correção":"Confirmar consumo"}</button><button class="btn btn-ghost" id="shSave">Salvar como meu shake</button>`;
    openSheet(o.entryId?"Corrigir shake":"Monte seu shake",body,foot);
    const q=s=>document.querySelectorAll("#sheetBody "+s);
    q("[data-wd]").forEach(b=>b.onclick=()=>{ st.wg=+(por()*+b.dataset.wd).toFixed(1); draw(); });
    q("[data-liq]").forEach(b=>b.onclick=()=>{ st.liq=b.dataset.liq; draw(); });
    q("[data-vol]").forEach(b=>b.onclick=()=>{ st.vol=+b.dataset.vol; draw(); });
    q("[data-ex]").forEach(b=>b.onclick=()=>{ const id=b.dataset.ex; if(id in st.items) delete st.items[id]; else st.items[id]=FOOD[id].por[0][1]; draw(); });
    q("[data-eg]").forEach(b=>b.onclick=()=>{ const [id,g]=b.dataset.eg.split("|"); st.items[id]=+g; draw(); });
    q("[data-xm]").forEach(b=>b.onclick=()=>{ const id=b.dataset.xm, s=st.items[id]<=30?5:10; st.items[id]=Math.max(5,st.items[id]-s); draw(); });
    q("[data-xp]").forEach(b=>b.onclick=()=>{ const id=b.dataset.xp, s=st.items[id]<=30?5:10; st.items[id]=Math.min(500,st.items[id]+s); draw(); });
    q("[data-meal]").forEach(b=>b.onclick=()=>{ st.meal=b.dataset.meal; draw(); });
    document.getElementById("shLabel").onclick=()=>openWhey(()=>draw());
    const nome=()=>(document.getElementById("shName").value||"").trim()||auto;
    document.getElementById("shSave").onclick=()=>{ (S.shakes ||= []).push({id:uid(),n:nome(),ing:ing.map(a=>[...a])}); save(); toast("Salvo em Meus shakes (aba Sugestões)"); };
    document.getElementById("shOk").onclick=()=>{
      const k=today(); S.days[k] ||= [];
      const ne=makeEntry({kind:"shake",n:nome(),ing,meal:st.meal});
      if(o.entryId){ const i=S.days[k].findIndex(e=>e.id===o.entryId); if(i>=0){ ne.id=o.entryId; S.days[k][i]=ne; } }
      else S.days[k].push(ne);
      save(); closeSheet(); if(view!=="hoje") go("hoje"); else renderHoje();
      toast(o.entryId?"Correção salva":`Registrado: ≈ ${fmtP(ne.p)} g de proteína`);
      checkCelebrate();
    };
  };
  draw();
}

/* ===== OPÇÕES PARA COMPLETAR A META ===== */
function candidates(){
  const list=[];
  COMBOS.forEach(c=>{ const v=comboNut(c); list.push({kind:"combo",ref:c.id,n:c.n,sub:c.ing.map(([id,g])=>`${FOOD[id].n} ${g} ${unit(FOOD[id])}`).join(" · "),p:v.p,kcal:v.kcal,fat:v.fat,meal:c.meal,whey:comboWhey(c),pronto:comboPronto(c),ilu:comboIlu(c)}); });
  QUICK.forEach(([id,g])=>{ const f=FOOD[id], v=foodNut(id,g); const pl=(f.por.find(x=>x[1]===g)||[`${g} ${unit(f)}`])[0];
    list.push({kind:"food",ref:id,g,n:f.n,sub:`${pl} (${g} ${unit(f)})${f.prep?" · "+f.prep:""}`,p:v.p,kcal:v.kcal,fat:v.fat,meal:null,whey:!!f.whey,pronto:!!f.pronto,ilu:isIlu(id)}); });
  return list;
}
function pickOptions(left){
  const meal=currentMeal(); const all=candidates();
  const lo = left<10 ? 0 : left*0.65, hi = left<10 ? left+6 : left*1.25;
  let pool=all.filter(c=>c.p>=lo && c.p<=hi);
  if(pool.length<3) pool=[...all].sort((a,b)=>Math.abs(a.p-left)-Math.abs(b.p-left)).slice(0,8);
  const score=c=>Math.abs(c.p-left) - (c.meal===meal?6:0) - (c.kind==="food"?2:0);
  pool.sort((a,b)=>score(a)-score(b));
  const out=[];
  const take=pred=>{ const c=pool.find(x=>pred(x) && !out.includes(x) && !(x.whey && out.some(o=>o.whey)) && !out.some(o=>o.ref===x.ref)); if(c) out.push(c); };
  take(c=>c.pronto);
  take(c=>c.kind==="combo" && (c.meal===meal||!c.meal));
  take(c=>!c.whey);
  while(out.length<3){ const n=out.length; take(()=>true); if(out.length===n) break; }
  return out.slice(0,3);
}
function optLabel(c){ return c.pronto?"Sem preparo":(c.kind==="combo"?"Refeição":"Porção simples"); }

function renderSug(){
  if(!SG.meal) SG.meal=currentMeal();
  const el=document.getElementById("v-sug");
  const left=Math.max(0,metaHoje()-dayTotal(today()));
  let body="";
  if(SG.tab==="ref"){
    let cs=COMBOS.filter(c=>c.meal===SG.meal).map(c=>({c,v:comboNut(c)}));
    if(SG.whey==="com") cs=cs.filter(x=>comboWhey(x.c)); if(SG.whey==="sem") cs=cs.filter(x=>!comboWhey(x.c));
    if(SG.fit && left>0) cs=cs.filter(x=>x.v.p<=left*1.25);

/* ===== HISTÓRICO (meta de cada dia) ===== */
let histSel=null;
function renderHist(){
  const created=S.profile.criado;
  const days=[...Array(7)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(6-i)); const k=dkey(d); return {k,d,t:dayTotal(k),m:dayMeta(k),pre:k<created}; });
  if(!histSel) histSel=today();
  const valid=days.filter(x=>!x.pre);
  const hit=valid.filter(x=>x.t>=x.m).length, avg=valid.reduce((a,x)=>a+x.t,0)/Math.max(1,valid.length);
  const W=340,H=210,top=24,bot=36,left=8,right=8, maxV=Math.max(...days.map(x=>x.m*1.25),...days.map(x=>x.t)); const ch=H-top-bot, bw=(W-left-right)/7;
  const y=v=>top+ch-(v/maxV)*ch;
  const wd=["dom","seg","ter","qua","qui","sex","sáb"];
  const bars=days.map((x,i)=>{ const bx=left+i*bw+bw*0.2, w=bw*0.6, by=y(x.t), ok=x.t>=x.m, sel=x.k===histSel, isT=x.k===today();
    const lab=`<text x="${bx+w/2}" y="${H-16}" text-anchor="middle" font-size="12" font-weight="${isT?800:600}" fill="${isT?"var(--ink)":"var(--muted)"}" font-family="Manrope,sans-serif">${isT?"hoje":wd[x.d.getDay()]}</text>`;
    if(x.pre) return `<g><text x="${bx+w/2}" y="${top+ch-4}" text-anchor="middle" font-size="12" fill="var(--muted)">–</text>${lab}</g>`;
    return `<g data-day="${x.k}" style="cursor:pointer"><rect x="${left+i*bw}" y="${top-10}" width="${bw}" height="${ch+40}" fill="transparent"/>
      <rect x="${bx}" y="${by}" width="${w}" height="${Math.max(2,top+ch-by)}" rx="7" fill="${ok?"var(--teal)":"var(--line)"}" ${sel?'stroke="var(--ink)" stroke-width="2"':""}/>
      <line x1="${bx-4}" x2="${bx+w+4}" y1="${y(x.m)}" y2="${y(x.m)}" stroke="var(--magenta)" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="${bx+w/2}" y="${Math.min(by,y(x.m))-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="Manrope,sans-serif">${Math.round(x.t)}</text>
      ${lab}${ok?`<text x="${bx+w/2}" y="${H-2}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--teal)">✓</text>`:""}</g>`; }).join("");
  const sel=dayEntries(histSel), selT=dayTotal(histSel), sd=new Date(histSel+"T12:00:00");
  document.getElementById("v-hist").innerHTML=`<div><h2 class="v-title">Últimos 7 dias</h2><p class="sub">Proteína consumida por dia · <span style="color:var(--magenta);font-weight:700">- - -</span> meta do dia</p></div>
    <div class="hist-card"><div class="hist-sum"><div><b class="num">${hit} de ${valid.length}</b><div class="sub">dias com meta atingida</div></div><div style="text-align:right"><b class="num">${fmtP(avg)} g</b><div class="sub">média diária</div></div></div>
      <svg class="hist-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Proteína por dia nos últimos 7 dias">${bars}</svg></div>
    <div><div class="label">${histSel===today()?"Hoje":sd.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})} · ≈ ${fmtP(selT)} g de ${dayMeta(histSel)} g</div></div>
    <div class="list">${sel.length? sel.map(e=>`<div class="row"><div class="ri"><div class="rn">${esc(e.n)}</div><div class="rm">${MEAL_NAME[e.meal]}${e.sim?' · <span class="badge b-sim">simulação</span>':""}${e.user?' · <span class="badge b-user">informado por você</span>':""}${e.demo?' · <span class="badge b-neutral">exemplo</span>':""}</div></div><div class="rp num">≈ ${fmtP(e.p)} g</div></div>`).join("") : `<div class="row"><div class="ri"><div class="rm">Nada registrado neste dia.</div></div></div>`}</div>
    <p class="foot-note">${MODE==="demo"?"Demonstração: todos os registros são exemplos fictícios.":"Dias anteriores ao cadastro aparecem com um traço."} Cada dia é comparado com a meta vigente naquele dia.</p>`;
  document.querySelectorAll("#v-hist [data-day]").forEach(g=>g.addEventListener("click",()=>{histSel=g.dataset.day; renderHist();}));
}

function checkCelebrate(){

  S.celebrated[k]=true; save();
  setTimeout(()=>{ const c=document.getElementById("celebrate"); document.getElementById("celVal").textContent=`${M} g`;

}
document.getElementById("celClose").onclick=()=>{ const c=document.getElementById("celebrate"); c.classList.remove("show"); setTimeout(()=>c.hidden=true,300); };
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("confetti"); cv.hidden=false; const ctx=cv.getContext("2d"); const dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement); const cols=[cs.getPropertyValue("--teal").trim()||"#007C78",cs.getPropertyValue("--magenta").trim()||"#C0265C","#E9C46A"];
  const P=[...Array(46)].map(()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*0.42,vx:(Math.random()-.5)*7,vy:-Math.random()*8-4,r:Math.random()*Math.PI,s:4+Math.random()*4,c:cols[Math.floor(Math.random()*3)]}));
  const t0=performance.now();
  const f=t=>{ const k=(t-t0)/2200; ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=0.22;p.x+=p.vx;p.y+=p.vy;p.r+=0.15; ctx.save(); ctx.globalAlpha=Math.max(0,1-k); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore();});
    if(k<1) requestAnimationFrame(f); else { ctx.clearRect(0,0,innerWidth,innerHeight); cv.hidden=true; } };
  requestAnimationFrame(f);
}

function openEditPerfil(){
  if(!hasCalc()){
    openSheet("Editar nome",`<label class="field" for="eNome"><span class="label">Como você quer ser chamado?</span><input class="inp" id="eNome" value="${esc(S.profile.nome)}"></label><div id="eErr"></div>`,`<button class="btn btn-primary" id="eSave">Salvar</button>`);
    document.getElementById("eSave").onclick=()=>{ const n=document.getElementById("eNome").value.trim(); if(n.length<2){ document.getElementById("eErr").innerHTML=errH("Informe seu nome."); return; }
      S.profile.nome=n; save(); setChrome(); closeSheet(); render(); toast("Nome atualizado"); };
    return;
  }
  const pf={...S.profile}; const E={};
  const draw=()=>{
    openSheet("Editar perfil",`
      <label class="field" for="eNome"><span class="label">Nome</span><input class="inp" id="eNome" value="${esc(pf.nome)}">${errH(E.nome)}</label>
      <div class="two"><label class="field" for="eIdade"><span class="label">Idade</span><div class="inp-u"><input class="inp" id="eIdade" type="number" inputmode="numeric" value="${esc(pf.idade)}"><span>anos</span></div>${errH(E.idade)}</label>
      <label class="field" for="ePeso"><span class="label">Peso</span><div class="inp-u"><input class="inp" id="ePeso" type="number" inputmode="decimal" step="0.1" value="${esc(pf.peso)}"><span>kg</span></div>${errH(E.peso)}</label></div>
      <label class="field" for="eAlt"><span class="label">Altura</span><div class="inp-u"><input class="inp" id="eAlt" type="number" inputmode="numeric" value="${esc(pf.altura)}"><span>cm</span></div>${errH(E.altura)}</label>
      <div class="field"><span class="label">Objetivo</span>${optCards("obj",Object.entries(OBJ).map(([id,o])=>({id,n:o.n,d:o.d})),pf.objetivo)}</div>
      <div class="field"><span class="label">Rotina</span>${optCards("niv",NIV,pf.nivel)}</div>
      <div class="field"><span class="label">Doença renal, gestação ou amamentação, orientação para controlar proteína ou condição de saúde em acompanhamento que envolva a alimentação?</span><div class="chips">${[["nao","Não"],["sim","Sim"]].map(([v,l])=>`<button class="chip" data-sau="${v}" aria-pressed="${pf.saude===v}">${l}</button>`).join("")}</div></div>`,
      `<button class="btn btn-primary" id="eSave">Salvar alterações</button>`);
    const keep=()=>{ pf.nome=document.getElementById("eNome").value; pf.idade=document.getElementById("eIdade").value; pf.peso=document.getElementById("ePeso").value; pf.altura=document.getElementById("eAlt").value; };
    document.querySelectorAll("#sheetBody [data-sexo]").forEach(b=>b.onclick=()=>{keep(); pf.sexo=b.dataset.sexo; draw();});
    document.querySelectorAll("#sheetBody [data-obj]").forEach(b=>b.onclick=()=>{keep(); pf.objetivo=b.dataset.obj; draw();});
    document.querySelectorAll("#sheetBody [data-niv]").forEach(b=>b.onclick=()=>{keep(); pf.nivel=b.dataset.niv; draw();});
    document.querySelectorAll("#sheetBody [data-sau]").forEach(b=>b.onclick=()=>{keep(); pf.saude=b.dataset.sau; draw();});
    document.getElementById("eSave").onclick=()=>{ keep(); Object.keys(E).forEach(k=>delete E[k]);
      Object.assign(E,validateStep(0,pf),validateStep(1,pf)); if((pf.nome||"").trim().length<2) E.nome="Informe seu nome."; if(Object.keys(E).length){ draw(); return; }
      applyProfile(cleanPf(pf)); };
  };
  draw();
}
const FIELD_N={peso:"Peso",altura:"Altura",idade:"Idade",objetivo:"Objetivo",nivel:"Rotina",saude:"Situação de saúde"};
function describe(k,v){ if(k==="peso") return fmt(v)+" kg"; if(k==="altura") return v+" cm"; if(k==="idade") return v+" anos"; if(k==="objetivo") return OBJ[v].n; if(k==="nivel") return NIV.find(n=>n.id===v).n; if(k==="saude") return v==="sim"?"Sim":"Não"; return v; }
function applyProfile(np){
  const old=S.profile; const changes=Object.keys(FIELD_N).filter(k=>old[k]!==np[k]);
  S.profile={...np,criado:old.criado}; save(); setChrome();
  const m=S.meta;
  if(m.tipo==="profissional"){ closeSheet(); render(); toast("Perfil atualizado. A meta definida por profissional foi mantida."); return; }
  const est=estimate(S.profile);
  if(est.blocked){
    openSheet("Meta mantida",`<div class="notice"><svg><use href="#i-warn"/></svg><span>${esc(est.blocked)}</span></div>
      <p class="sub">Sua meta atual de <b>${m.valor} g</b> foi mantida, mas não é mais recomendada como estimativa automática. Informe a meta definida pelo profissional.</p>`,
      `<button class="btn btn-primary" id="bProf">Informar meta do profissional</button><button class="btn btn-link" id="bLater">Agora não</button>`);
    document.getElementById("bProf").onclick=()=>openProfMeta();
    document.getElementById("bLater").onclick=()=>{ closeSheet(); render(); };
    render(); return;
  }
  if(est.valor===m.valor){ S.meta.calc=est; save(); closeSheet(); render(); toast(`Perfil atualizado. Sua meta continua ${m.valor} g.`); return; }
  openSheet("Revisar sua meta",`
    <p class="sub">Com as mudanças no seu perfil, a estimativa da meta diária mudaria:</p>
    <div class="cmp-meta"><div><span class="label">Atual</span><b class="num">${m.valor} g</b></div><svg width="22" height="22" style="color:var(--muted)"><use href="#i-arrow"/></svg><div><span class="label">Nova estimativa</span><b class="num" style="color:var(--teal)">${est.valor} g</b></div></div>
    ${changes.length?`<div class="list">${changes.map(k=>`<div class="row"><div class="ri"><div class="rm">${FIELD_N[k]}</div><div class="rn">${esc(describe(k,old[k]))} → ${esc(describe(k,np[k]))}</div></div></div>`).join("")}</div>`:""}
    <details class="more"><summary>Como a nova estimativa foi calculada</summary>${calcRows(est)}</details>
    <p class="hint">Nada muda sem a sua confirmação. Os dias anteriores continuam comparados com a meta que valia em cada dia.</p>`,
    `<button class="btn btn-primary" id="rUpd">Atualizar meta para ${est.valor} g</button><button class="btn btn-link" id="rKeep">Manter ${m.valor} g</button>`);
  document.getElementById("rUpd").onclick=()=>{ setMeta(est.valor,"estimativa",{calc:est}); closeSheet(); renderAfterMeta(`Meta atualizada para ${est.valor} g a partir de hoje`); };
  document.getElementById("rKeep").onclick=()=>{ closeSheet(); render(); toast(`Meta mantida em ${m.valor} g`); };
}

/* ===== TOAST ===== */
let toastT;
function toast(msg,undo){ const t=document.getElementById("toast"), u=document.getElementById("toastUndo"); document.getElementById("toastMsg").textContent=msg;
  u.hidden=!undo; u.onclick=()=>{ undo&&undo(); t.classList.remove("show"); }; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), undo?5000:2600); }

/* ===== INÍCIO ===== */
(function init(){
  const m=lsGet(KMODE);
  if(m && KEYS[m]){ const d=load(m); if(d){ S=d; MODE=m; fixState(); go("hoje"); return; } }
  showWelcome();
})();
let dayShown=today();
function refreshDay(){ if(!S||document.hidden||!sheet.hidden) return; if(today()!==dayShown){ dayShown=today(); shownP=null; histSel=null; } render(); }
document.addEventListener("visibilitychange",refreshDay); window.addEventListener("focus",refreshDay);
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
